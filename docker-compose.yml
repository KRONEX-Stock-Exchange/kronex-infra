services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stock}
    command: ["mysqld", "--port=${MYSQL_PORT:?MYSQL_PORT is required}"]
    ports:
      - "${MYSQL_PORT:?MYSQL_PORT is required}:${MYSQL_PORT:?MYSQL_PORT is required}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-P",
          "${MYSQL_PORT:?MYSQL_PORT is required}",
          "-u",
          "root",
          "-p${MYSQL_PASSWORD:-1234}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?RABBITMQ_PORT is required}
      RABBITMQ_MGMT_PORT: ${RABBITMQ_MGMT_PORT:?RABBITMQ_MGMT_PORT is required}
      RABBITMQ_NODE_PORT: ${RABBITMQ_PORT:?RABBITMQ_PORT is required}
    entrypoint:
      - sh
      - -c
      - |
        printf 'listeners.tcp.default = %s\nmanagement.tcp.port = %s\n' "$$RABBITMQ_PORT" "$$RABBITMQ_MGMT_PORT" > /etc/rabbitmq/conf.d/20-ports.conf
        exec docker-entrypoint.sh rabbitmq-server
    ports:
      - "${RABBITMQ_PORT:?RABBITMQ_PORT is required}:${RABBITMQ_PORT:?RABBITMQ_PORT is required}"
      - "${RABBITMQ_MGMT_PORT:?RABBITMQ_MGMT_PORT is required}:${RABBITMQ_MGMT_PORT:?RABBITMQ_MGMT_PORT is required}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ../kronex-server
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL is required}
      SERVER_PORT: ${SERVER_PORT:?SERVER_PORT is required}
    volumes:
      - ../kronex-server/src:/app/src:ro
      - ../kronex-server/tsconfig.json:/app/tsconfig.json:ro
    ports:
      - "${SERVER_PORT:?SERVER_PORT is required}:${SERVER_PORT:?SERVER_PORT is required}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(Number(process.env.SERVER_PORT),'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  engine:
    build:
      context: ../kronex-engine
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL is required}
      MYSQL_HOST: mysql
      MYSQL_PORT: ${MYSQL_PORT:?MYSQL_PORT is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:?RABBITMQ_PORT is required}
      WAL_DIR: /data/wal
    volumes:
      - engine-wal:/data/wal
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      server:
        condition: service_healthy

  realtime-server:
    build:
      context: ../kronex-realtime-server
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL is required}
      REALTIME_SERVER_PORT: ${REALTIME_SERVER_PORT:?REALTIME_SERVER_PORT is required}
    ports:
      - "${REALTIME_SERVER_PORT:?REALTIME_SERVER_PORT is required}:${REALTIME_SERVER_PORT:?REALTIME_SERVER_PORT is required}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(Number(process.env.REALTIME_SERVER_PORT),'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      server:
        condition: service_healthy

volumes:
  mysql-data:
  engine-wal:
